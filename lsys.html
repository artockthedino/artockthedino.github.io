<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>L-System Generator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; display: flex; gap: 20px; height: 95vh; }
        #controls { width: 320px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 10px; }
        input, textarea, button { width: 100%; box-sizing: border-box; padding: 5px; }
        #output { flex-grow: 1; border: 1px solid #ccc; background: #fff; display: flex; justify-content: center; align-items: center; }
        svg { width: 100%; height: 100%; display: block; }
        label { font-weight: bold; font-size: 0.85em; margin-top: 5px; }
        .row { display: flex; gap: 5px; align-items: center; }
        .row > * { flex: 1; }
    </style>
</head>
<body>

<div id="controls">
    <h3>L-System Generator</h3>
    <label>Axiom (Start String)</label>
    <input id="axiom" value="F">
    <label>Rules (e.g., F>F+G+F)</label>
    <textarea id="rules" rows="4">F>F-G+F+G-F&#10;G>GG</textarea>
    <label>Iterations</label>
    <input type="number" id="iters" value="4">
    <label>Angles (Turn / Initial)</label>
    <div class="row">
        <input type="number" id="angle" value="60" title="Turn Angle">
        <input type="number" id="startAngle" value="0" title="Initial Direction">
    </div>
    <label>Appearance (Stroke / BG / Width)</label>
    <div class="row">
        <input type="color" id="strokeColor" value="#000000">
        <input type="color" id="bgColor" value="#ffffff">
        <input type="number" id="thickness" value="1" step="0.1">
    </div>
    <button onclick="generate()" style="background: #e0f0ff; font-weight: bold;">Generate</button>
    <button onclick="downloadSVG()">Download SVG</button>
    <div id="stats" style="font-size: 0.8em; color: #666; margin-top: 10px;"></div>
</div>

<div id="output">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <rect id="bg" width="100%" height="100%" fill="#ffffff" />
        <path id="path" fill="none" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</div>

<script>
function generate() {
    const axiom = document.getElementById('axiom').value;
    const rulesText = document.getElementById('rules').value;
    const iters = parseInt(document.getElementById('iters').value);
    const angleStep = parseFloat(document.getElementById('angle').value) * Math.PI / 180;
    const startAngle = parseFloat(document.getElementById('startAngle').value) * Math.PI / 180;
    
    // Parse Rules (Format: char>replacement)
    const rules = {};
    rulesText.split('\n').forEach(line => {
        const parts = line.split('>');
        if (parts.length === 2) rules[parts[0].trim()] = parts[1].trim();
    });

    // Expand
    let current = axiom;
    for (let i = 0; i < iters; i++) {
        let next = "";
        for (let char of current) next += rules[char] || char;
        current = next;
    }

    // Turtle
    let x = 0, y = 0, angle = startAngle;
    let stack = [], d = `M ${x} ${y} `;
    let minX = 0, minY = 0, maxX = 0, maxY = 0;

    const updateBounds = (nx, ny) => {
        minX = Math.min(minX, nx); minY = Math.min(minY, ny);
        maxX = Math.max(maxX, nx); maxY = Math.max(maxY, ny);
    };

    for (let char of current) {
        if (char >= 'A' && char <= 'L') {
            x += Math.cos(angle) * 10; y += Math.sin(angle) * 10;
            d += `L ${x} ${y} `;
            updateBounds(x, y);
        } else if (char >= 'M' && char <= 'Z') {
            x += Math.cos(angle) * 10; y += Math.sin(angle) * 10;
            d += `M ${x} ${y} `;
            updateBounds(x, y);
        } else if (char === '+') angle += angleStep;
        else if (char === '-') angle -= angleStep;
        else if (char === '[') stack.push({x, y, angle});
        else if (char === ']') {
            let s = stack.pop();
            if (s) { x = s.x; y = s.y; angle = s.angle; d += `M ${x} ${y} `; }
        }
    }

    // Update Styles
    document.getElementById('bg').setAttribute('fill', document.getElementById('bgColor').value);
    const pathEl = document.getElementById('path');
    pathEl.setAttribute('d', d);
    pathEl.setAttribute('stroke', document.getElementById('strokeColor').value);
    pathEl.setAttribute('stroke-width', document.getElementById('thickness').value);
    
    // 1:1 Aspect Ratio Logic
    const width = maxX - minX, height = maxY - minY;
    const size = Math.max(width, height) || 10;
    const centerX = minX + width / 2, centerY = minY + height / 2;
    const margin = size * 0.05 + 2; 
    const finalSize = size + margin * 2;
    
    const svg = document.getElementById('svg');
    svg.setAttribute('viewBox', `${centerX - finalSize/2} ${centerY - finalSize/2} ${finalSize} ${finalSize}`);
    document.getElementById('stats').innerText = `Nodes: ${current.length.toLocaleString()}`;
}

function downloadSVG() {
    const svgData = document.getElementById('svg').outerHTML;
    const blob = new Blob([`<?xml version="1.0" standalone="no"?>\r\n${svgData}`], {type:"image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "lsystem.svg";
    link.click();
    URL.revokeObjectURL(url);
}

generate();
</script>
</body>
</html>
